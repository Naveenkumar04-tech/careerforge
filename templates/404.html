{% extends "base.html" %}

{% block title %}Page Not Found | Student Career System{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-extrabold text-primary mb-2">404</h1>
            <h3 class="fw-bold mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">
                {{ error_message if error_message else "The page or student profile you are looking for does not exist or has been moved." }}
            </p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
                <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
